# 브랜치에 push 하면 도는 검사 — **배포되는 화면만** 본다.
#
# 키트(제출물 만들기·공식 검증·시나리오 재생)는 여기서 돌리지 않는다. 그건 로컬에서
# Simulation API 를 띄워 놓고 하는 일이고, 배포본에는 그 서버가 없다.
#
# 그래서 이 검사는 **배포된 것과 같은 조건**에서 돈다 — API 없이, 내장 데이터 체험 모드로.
# 화면이 그 모드에서 무너지면 심사위원이 여는 주소에서도 무너진다는 뜻이다.
#
# `pull_request` 가 아니라 `push` 에 거는 이유: 자동으로 여는 PR 은 GITHUB_TOKEN 이
# 만드는데, GitHub 은 **GITHUB_TOKEN 이 일으킨 이벤트로는 새 워크플로를 돌리지 않는다**
# (무한 재귀 방지). `pull_request` 에 걸면 자동 PR 에서 검사가 영영 돌지 않아 자동 병합이
# «검사 기다리는 중» 으로 멈춰 선다. 상태 검사는 이벤트가 아니라 **커밋 SHA** 에 붙으므로,
# push 로 돌려도 같은 SHA 를 가리키는 PR 의 필수 검사를 그대로 만족시킨다.
name: CI

on:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22   # 키트 지원 범위 20.x || 22.x — 24 는 쓰지 않는다
          cache: npm

      - name: 의존성
        run: npm ci

      - name: 타입
        run: npm run typecheck

      # 파이프로 넘기지 않는다 — tail 로 넘기면 종료 코드가 tail 것이 되어 실패가 통과로 보인다.
      - name: 단위 (색 대비·터치 타깃·토큰 전수 검사 포함)
        run: npm test

      # 배포되는 물건이 실제로 만들어지는지부터 본다. 여기서 깨지면 뒤는 볼 것도 없다.
      - name: 화면 빌드
        run: npm run build

      - name: 브라우저
        run: npx playwright install --with-deps chromium

      # e2e 설정에 webServer 가 없어(키트 루트 설정을 건드리지 않으려고) 여기서 띄운다.
      # **API 는 일부러 띄우지 않는다** — 배포본에 없는 것을 CI 에만 있게 하면,
      # 통과한 검사가 배포된 화면에 대해 아무것도 보증하지 못한다.
      - name: 화면 서버 (:5173 · API 없음 = 배포본과 같은 조건)
        run: |
          npm run dev > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -m 2 http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          echo "::error::화면 서버가 60초 안에 뜨지 않았습니다"; cat "$RUNNER_TEMP/web.log"; exit 1

      # D11 은 오류 주입 7종을 확인하는데, 그 기능은 **Simulation API 가 있을 때만** 화면에
      # 나온다. 배포본에 없는 기능이므로 여기서 제외한다 — 로컬 게이트가 계속 지킨다.
      # (제목이 바뀌면 -invert 가 안 맞아 D11 이 그냥 돌고 실패한다. 조용히 빠지지 않는다.)
      - name: 화면 e2e
        run: npm run test:e2e -- --grep-invert "D11"

      - name: 실패했을 때 볼 것
        if: failure()
        run: tail -60 "$RUNNER_TEMP/web.log" || true

      - name: e2e 흔적
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ github.run_id }}
          path: workspace/23C/test-results
          retention-days: 7
          if-no-files-found: ignore
