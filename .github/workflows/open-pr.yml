# 브랜치를 push 하면 PR 을 열고 «CI 통과하면 병합» 을 예약한다.
#
# 병합은 우리가 하지 않는다 — GitHub 의 auto-merge 가 필수 검사 통과를 기다렸다가 스스로
# 병합한다. 우리가 «검사 다 됐나» 를 폴링하면 그 판단이 두 벌이 되고, 둘이 어긋나면
# 검사가 빨간데 병합되는 일이 생긴다.
#
# 보안: 이 저장소는 공개다. 브랜치 이름·커밋 제목은 **누가 쓴 글**이므로 `${{ }}` 로
# 명령줄에 바로 끼워 넣지 않는다(셸 주입). env 로 넘겨 따옴표 안에서만 쓴다.
name: Open PR

on:
  push:
    branches-ignore: [main]

permissions:
  # 자동 병합 «예약» 도 병합 동작이라 contents: write 가 있어야 한다.
  # read 로 두면 PR 은 열리는데 예약에서 «Resource not accessible by integration
  # (mergePullRequest)» 로 조용히 넘어간다 — PR 만 쌓이고 아무것도 병합되지 않는다.
  contents: write
  pull-requests: write

jobs:
  open:
    name: PR 열고 자동 병합 예약
    runs-on: ubuntu-latest
    # 포크에서 온 push 는 여기 오지 않지만, 다른 저장소로 복제됐을 때를 위해 못 박는다.
    if: github.repository == 'zxcv718/kiobridge-23c'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: PR 만들기 (이미 있으면 그대로 둔다)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          num="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            title="$(git log -1 --pretty=%s)"
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file - <<'BODY'
          브랜치를 push 해서 자동으로 열린 PR 입니다.

          - **CI(`gate`)가 통과하면 자동으로 main 에 병합**되고, 곧바로 배포까지 나갑니다.
          - 아직 올리고 싶지 않으면 **`hold` 라벨**을 붙이세요. 자동 병합만 멈추고 CI 는 계속 돕니다.
          - 다시 올릴 준비가 되면 라벨을 떼면 됩니다.
          BODY
            num="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "PR_NUMBER=$num" >> "$GITHUB_ENV"

      # 예약만은 GITHUB_TOKEN 이 아니라 사람 토큰으로 건다.
      #
      # GitHub 은 GITHUB_TOKEN 이 일으킨 이벤트로 새 워크플로를 돌리지 않는다(무한 재귀
      # 방지). 봇이 예약하면 병합 커밋도 봇 것이 되고, **그 push 가 Deploy 를 깨우지
      # 못한다.** 실제로 PR #1 이 그렇게 병합됐고 배포는 돌지 않았다 — 초록으로 병합됐는데
      # 사이트는 그대로인, 알아채기 어려운 상태였다.
      #
      # AUTOMERGE_TOKEN 이 없으면 예약을 건너뛴다. 조용히 GITHUB_TOKEN 으로 되돌리지
      # 않는다 — 그러면 «병합은 되는데 배포는 안 되는» 상태로 다시 돌아가고, 워크플로는
      # 성공으로 끝나 아무도 모른다.
      - name: 자동 병합 예약
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::AUTOMERGE_TOKEN 이 없어 자동 병합을 예약하지 않았습니다. PR 에서 직접 Merge 하세요 (그 병합은 배포를 깨웁니다)."
            exit 0
          fi
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')"
          case ",$labels," in
            *,hold,*)
              echo "::notice::'hold' 라벨이 있어 자동 병합을 예약하지 않습니다."
              exit 0
              ;;
          esac
          gh pr merge "$PR_NUMBER" --auto --merge \
            || echo "::warning::자동 병합 예약 실패 — 저장소 Settings 에서 'Allow auto-merge' 가 켜져 있는지, main 에 필수 검사가 걸려 있는지 확인하세요."
