# main 에 들어오면 배포한다.
#
# **저장소 바깥에서 배포한다.** 이유가 있다 — Vercel CLI 는 git 저장소 안에서 돌면 그
# 저장소의 HEAD 커밋 작성자를 배포에 함께 실어 보내고, Hobby 요금제는 그 작성자가 프로젝트에
# 접근 권한이 있는지 검사한다. 실제로 로컬에서 이메일을 잘못 적어 두었을 때 이 검사에
# 걸려 배포가 거부된 적이 있다.
#
# 기여자가 늘면 main 의 HEAD 는 병합 커밋(작성자 github-actions)이거나 기여자 커밋이 된다.
# 둘 다 Vercel 계정이 아니므로, 저장소 안에서 배포하면 **기여자가 뭔가 올릴 때마다 배포가
# 막힌다.** 빌드 결과만 저장소 밖으로 옮겨 배포하면 git 정보가 아예 실리지 않아 검사할
# 작성자 자체가 없다. 그래서 누가 커밋했든 상관없어진다.
#
# 대안이었던 «병합 커밋을 소유자 이메일로 위장하기» 는 쓰지 않는다. 기록을 사실과 다르게
# 만들면서까지 얻을 것이 없고, 누가 무엇을 했는지가 흐려진다.
name: Deploy

on:
  push:
    branches: [main]

# 배포는 순서가 뜻을 가진다. 뒤에 온 것이 이겨야 하므로 진행 중인 것을 취소한다.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel 배포
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'zxcv718/kiobridge-23c'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성
        run: npm ci

      # PR 두 개가 각자 초록이어도 합쳐 놓으면 깨질 수 있다(같은 것을 서로 다르게 고친 경우).
      # 병합된 상태에서 다시 한 번 본다 — 30초면 끝나고, 깨진 것을 배포하는 것보다 싸다.
      - name: 타입
        run: npx tsc --noEmit -p workspace/23C/tsconfig.json

      - name: 단위
        run: npx vitest run --config workspace/23C/vitest.config.ts

      - name: 화면 빌드
        run: npx vite build --config workspace/23C/ui/vite.config.ts

      - name: 저장소 바깥으로 옮긴다 (git 정보를 떼기 위해)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/deploy"
          mkdir -p "$RUNNER_TEMP/deploy"
          cp -R workspace/23C/ui/dist/. "$RUNNER_TEMP/deploy"/
          if [ -e "$RUNNER_TEMP/deploy/.git" ]; then
            echo "::error::옮긴 자리에 .git 이 딸려 왔습니다 — 이대로 배포하면 작성자 검사에 걸립니다"
            exit 1
          fi
          test -f "$RUNNER_TEMP/deploy/index.html" || { echo "::error::index.html 이 없습니다"; exit 1; }

      - name: 배포
        working-directory: ${{ runner.temp }}/deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "$url"
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 이번 배포: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- 고정 주소: https://kiobridge-23c-demo.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      # 별칭이 실제로 새 배포를 가리키는지 확인한다. 배포가 «성공»했는데 사람이 여는 주소는
      # 옛것인 경우가 있어서, 여기서 번들 이름을 맞춰 본다.
      - name: 고정 주소가 새 번들을 주는가
        run: |
          set -euo pipefail
          built="$(ls workspace/23C/ui/dist/assets | grep -E '^index-.*\.js$' | head -1)"
          for _ in $(seq 1 20); do
            live="$(curl -sf https://kiobridge-23c-demo.vercel.app | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
            [ "$live" = "$built" ] && { echo "일치: $built"; exit 0; }
            sleep 3
          done
          echo "::error::고정 주소가 아직 옛 번들을 줍니다 (빌드 $built · 배포본 ${live:-없음})"
          exit 1
