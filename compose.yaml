# KioBridge Simulation Platform — local digital-twin stack.
# SIMULATION_ONLY. No service connects to a real device, agent, payment or gov
# system. The platform does NOT run a participant recommender — participants
# submit results to the simulation-api from their own service.
services:
  simulation-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:api
    environment:
      - PORT=4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w @kiobridge/simulator-web -- --host 0.0.0.0 --port 3000
    environment:
      - VITE_CORE_API_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - simulation-api
